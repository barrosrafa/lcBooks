[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcbooks"
version = "0.1.0"
description = "Geração de capítulos, roteiros e ideias visuais a partir de livros em PDF usando LangChain e Gemini"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "pypdf>=5.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
lcbooks = "lcbooks.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
